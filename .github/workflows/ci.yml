name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format and lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Format check
        run: golangci-lint fmt --diff
      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoreach
          POSTGRES_PASSWORD: autoreach
          POSTGRES_DB: autoreach_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U autoreach -d autoreach_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports:
          - 56379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        env:
          TEST_REQUIRE_SERVICES: "1"
        run: go test -tags=integration -count=1 -p 1 ./tests/integration/...
