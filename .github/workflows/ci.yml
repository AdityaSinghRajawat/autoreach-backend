name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format and lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Format check
        run: golangci-lint fmt --diff
      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoreach
          POSTGRES_PASSWORD: autoreach
          POSTGRES_DB: autoreach_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U autoreach -d autoreach_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports:
          - 56379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start S3 test service
        run: |
          docker run -d --name s3-test -p 59090:9090 adobe/s3mock:3.12.0
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:59090/ >/dev/null && break
            sleep 2
          done
      - name: Start mail test service
        run: |
          docker run -d --name mail-test -p 53025:3025 -p 53143:3143             -e GREENMAIL_OPTS="-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email -Dgreenmail.users=alex:alex-password@example.com,sarah:sarah-password@acme.test"             greenmail/standalone:2.1.8
          for attempt in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/53143) 2>/dev/null && break
            sleep 2
          done
      - name: Integration tests
        env:
          TEST_REQUIRE_SERVICES: "1"
        run: go test -tags=integration -count=1 -p 1 ./tests/integration/...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities in dependencies and the standard library
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Secrets in git history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t autoreach-backend:ci .
      - name: Validate the production compose file
        run: |
          AUTOREACH_ENV_FILE=.env.example DB_PASSWORD=x REDIS_PASSWORD=x JWT_SECRET=x INTERNAL_SHARED_SECRET=x CHANNEL_CREDENTIAL_KEYS=x docker compose config --quiet
