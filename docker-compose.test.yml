services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autoreach
      POSTGRES_PASSWORD: autoreach
      POSTGRES_DB: autoreach_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoreach -d autoreach_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:56379:6379"

  s3-test:
    image: adobe/s3mock:3.12.0
    ports:
      - "127.0.0.1:59090:9090"
