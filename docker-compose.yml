# Production stack: API server, worker, Postgres (pgvector), Redis and the migration job.
# Configuration comes from .env (copy .env.example); the values below override what must differ
# inside the stack. Set AUTOREACH_IMAGE to run a published image instead of building locally.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  PORT: 8080
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-autoreach}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:-autoreach}
  DB_SCHEMA: ${DB_SCHEMA:-autoreach}
  DB_SSLMODE: disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}
  CHANNEL_CREDENTIAL_KEYS: ${CHANNEL_CREDENTIAL_KEYS:?CHANNEL_CREDENTIAL_KEYS is required}
  STORAGE_LOCAL_DIR: /app/data/uploads

x-app: &app
  image: ${AUTOREACH_IMAGE:-autoreach-backend:local}
  build: .
  restart: unless-stopped
  env_file: ${AUTOREACH_ENV_FILE:-.env}
  environment: *app-env
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  volumes:
    # Resumes uploaded through the server are read by the worker, so both share the upload volume
    # (not needed with STORAGE_DRIVER=s3).
    - uploads:/app/data/uploads
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  stop_grace_period: 45s
  mem_limit: 512m
  logging: *default-logging

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${DB_USER:-autoreach}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-autoreach}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autoreach} -d ${DB_NAME:-autoreach}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # The task queue must never lose keys to eviction, and AOF keeps queued tasks across restarts.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "noeviction"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-autoreach}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-autoreach}?sslmode=disable&search_path=${DB_SCHEMA:-autoreach},public"
      - "up"
    logging: *default-logging

  server:
    <<: *app
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8080}:8080"

  worker:
    <<: *app
    command: ["worker"]
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-8081}:8080"

volumes:
  postgres-data:
  redis-data:
  uploads:
